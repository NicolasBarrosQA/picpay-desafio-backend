services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: picpay
      POSTGRES_PASSWORD: picpay
      POSTGRES_DB: picpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpay -d picpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://picpay:picpay@db:5432/picpay
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn picpay.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
